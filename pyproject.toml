[project]
name = "mcp-vision-runtime"
version = "0.9.0"
description = "Plip: an AI buddy in your MacBook's notch. Talk, it sees your screen, answers aloud and points, on your Claude, ChatGPT, Cursor or Gemini plan."
authors = [{name = "Hussain"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "mss>=9.0.2",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyautogui>=0.9.54; sys_platform != 'darwin'",       # cursor position off macOS (headless `plip ask`)
    "click>=8.1.0",
    "websockets>=13.0",
    "sounddevice>=0.4.6; sys_platform == 'darwin'",
    "sherpa-onnx>=1.13.8; sys_platform == 'darwin'",     # runs Parakeet; the model itself is an opt-in download
    "sherpa-onnx-core>=1.13.8; sys_platform == 'darwin'",   # sherpa-onnx's native half (uv's lock misses it)
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Speech>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.14,<1"]

[project.scripts]
plip = "mcp_vision.buddy.cli:buddy"

[project.urls]
Homepage = "https://github.com/hussainn7/plip-oss"
Repository = "https://github.com/hussainn7/plip-oss"
Issues = "https://github.com/hussainn7/plip-oss/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_vision"]

[tool.hatch.build.targets.wheel.sources]
"src/mcp_vision" = "mcp_vision"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.uv]
package = true
