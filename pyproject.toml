[project]
name = "screen-agent"
version = "0.1.0"
description = "Local screenshot-to-click agent using Ollama and MCP"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.3.0",
    "mcp[cli]>=1.0.0",
    "playwright>=1.40.0",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyautogui>=0.9.54",
    "mss>=9.0.2",
    "Pillow>=10.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
]

[project.scripts]
mac-agent = "mac_agent:run"
screen-agent = "simple_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phase1_vision", "phase2_mcp"]
