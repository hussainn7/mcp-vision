[project]
name = "mcp-vision"
version = "0.2.0"
description = "Local multi-modal desktop agent: screen perception and actuation over MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "mcp[cli]>=1.0.0",
    "mss>=9.0.2",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyautogui>=0.9.54",
    "click>=8.1.0",
    "ollama>=0.3.0",
    "playwright>=1.40.0",
    "loguru>=0.7.0",
    "rich>=13.0.0",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
hud = ["pyside6>=6.6.0"]
ocr = ["pytesseract>=0.3.10"]
dev = ["pytest>=8.0.0"]

[project.scripts]
mac-agent = "mac_agent:run"
screen-agent = "simple_agent:main"

[project.urls]
Homepage = "https://github.com/hussainn7/mcp-vision"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_vision", "phase1_vision", "phase2_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/mcp_vision" = "mcp_vision"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
