[project]
name = "mcp-vision"
version = "0.3.0"
description = "Model-neutral computer-use runtime with grounded actions and explicit evidence"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "mcp[cli]>=1.0.0",
    "mss>=9.0.2",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyautogui>=0.9.54",
    "click>=8.1.0",
    "ollama>=0.3.0",
    "playwright>=1.40.0",
    "loguru>=0.7.0",
    "rich>=13.0.0",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
hud = ["pyside6>=6.6.0"]
ocr = ["pytesseract>=0.3.10"]
dev = ["pytest>=8.0.0"]

[project.scripts]
mcp-vision = "mcp_vision.cli:cli"
mac-agent = "mcp_vision.cli:agent_cli"
screen-agent = "simple_agent:main"

[project.urls]
Homepage = "https://github.com/hussainn7/mcp-vision"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_vision", "phase1_vision", "phase2_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/mcp_vision" = "mcp_vision"

# Compatibility modules used by the original agent. Keep the installed wheel
# equivalent to a checkout until these imports move under mcp_vision.
[tool.hatch.build.targets.wheel.force-include]
"agent.py" = "agent.py"
"mac_agent.py" = "mac_agent.py"
"simple_agent.py" = "simple_agent.py"
"backends.py" = "backends.py"
"config.py" = "config.py"
"runtime.py" = "runtime.py"
"tools.py" = "tools.py"
"trace_viewer.py" = "trace_viewer.py"
"judge.py" = "judge.py"
"skills.py" = "skills.py"
"dashboard.py" = "dashboard.py"
"specialists.toml" = "specialists.toml"
"chrome_relay" = "chrome_relay"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
