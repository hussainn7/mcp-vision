name: release dmg

# Push a tag like v0.8.0: this builds Plip-<version>.dmg with scripts/build_dmg.py and attaches it to a
# GitHub release. With the Apple secrets set (docs/RELEASING.md) it's signed + notarized, so it opens
# with no warning; without them it's signed ad hoc. With the Supabase secrets set it asks people to sign in.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
    steps:
      - uses: actions/checkout@v7
      - name: uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Developer ID certificate + notary login (only when the Apple secrets are set)
        if: env.APPLE_CERT_P12 != ''
        env:
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_SIGN_ID: ${{ secrets.APPLE_SIGN_ID }}
        run: |
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm "$RUNNER_TEMP/cert.p12"
          xcrun notarytool store-credentials plip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          echo "SIGN_ID=$APPLE_SIGN_ID" >> "$GITHUB_ENV"
      - name: Build Plip.app + the dmg
        env:
          PLIP_SUPABASE_URL: ${{ secrets.PLIP_SUPABASE_URL }}
          PLIP_SUPABASE_KEY: ${{ secrets.PLIP_SUPABASE_KEY }}
        run: |
          if [ -n "${SIGN_ID:-}" ]; then
            uv run --no-project --python 3.12 scripts/build_dmg.py --sign "$SIGN_ID" --notarize plip
          else
            uv run --no-project --python 3.12 scripts/build_dmg.py
          fi
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Plip-*.dmg
