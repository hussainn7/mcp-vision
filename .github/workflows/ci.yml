name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]' build
      - name: Lint
        run: ruff check .
      - name: Tests (no model, no network, no display)
        run: python -m pytest
      - name: Build the wheel
        run: python -m build --wheel
      - name: Installed wheel, from outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/plip" --help
          "$RUNNER_TEMP/wheel-env/bin/python" -c "from importlib.resources import files; \
            import mcp_vision.buddy.companion, mcp_vision.analytics; \
            assert (files('mcp_vision.buddy') / 'web' / 'index.html').is_file()"

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - name: Build the single-file bundle and check the committed copy is current
        run: |
          npm run build
          git diff --exit-code -- ../src/mcp_vision/buddy/web/index.html
      - name: Click through the island and dashboard
        run: npm run e2e
