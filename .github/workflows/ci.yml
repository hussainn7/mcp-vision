name: ci

on:
  push:
  pull_request:

jobs:
  demos-and-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ollama pydantic-settings loguru pillow
      - name: module self-checks
        run: python tests/run.py
      - name: bench (dry, deterministic)
        run: python bench/runner.py

  e2e-playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ollama pydantic-settings loguru pillow playwright
      - run: python -m playwright install --with-deps chromium
      - name: headless browser workflows
        run: python tests/e2e_web.py
